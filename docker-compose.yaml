networks:
  mechanic-shop-network:
  newrelic-mechanic-shop:
    driver: bridge
services:
  postgres:
    image: postgres:17
    container_name: postgres17
    restart: always
    environment:
      POSTGRES_DB: mechanic-shop-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - mechanic-shop-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mechanic-shop-db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_java
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - mechanic-shop-network
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
    networks:
      - mechanic-shop-network

  springapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: mechanic-shop-api
    container_name: springapp
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - mechanic-shop-network
      - newrelic-mechanic-shop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mechanic-shop-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: mechanic-shop (Local)
      NEW_RELIC_LABELS: env:local;service:mechanic-shop
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal-shared-secret-change-me}

      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      SEED_WH_NAME: ${SEED_WH_NAME}
      SEED_WH_EMAIL: ${SEED_WH_EMAIL}
      SEED_WH_DOC: ${SEED_WH_DOC}
      SEED_WH_ROLE: ${SEED_WH_ROLE}

      SEED_RC_NAME: ${SEED_RC_NAME}
      SEED_RC_EMAIL: ${SEED_RC_EMAIL}
      SEED_RC_DOC: ${SEED_RC_DOC}
      SEED_RC_ROLE: ${SEED_RC_ROLE}

      SEED_MC_NAME: ${SEED_MC_NAME}
      SEED_MC_EMAIL: ${SEED_MC_EMAIL}
      SEED_MC_DOC: ${SEED_MC_DOC}
      SEED_MC_ROLE: ${SEED_MC_ROLE}

      SEED_AD_NAME: ${SEED_AD_NAME}
      SEED_AD_EMAIL: ${SEED_AD_EMAIL}
      SEED_AD_DOC: ${SEED_AD_DOC}
      SEED_AD_ROLE: ${SEED_AD_ROLE}

      SEED_BY_NAME: ${SEED_BY_NAME}
      SEED_BY_EMAIL: ${SEED_BY_EMAIL}
      SEED_BY_DOC: ${SEED_BY_DOC}
      SEED_BY_ROLE: ${SEED_BY_ROLE}

      SMTP_ACTIVE: ${SMTP_ACTIVE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

  kong:
    image: kong:3.7
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    networks:
      - mechanic-shop-network
    depends_on:
      - springapp

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpassword
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_db_data:/var/lib/postgresql/data

  newrelic:
    container_name: newrelic-infra
    build:
      context: .
      dockerfile: infra/newrelic/newrelic-infra.dockerfile
    cap_add:
      - SYS_PTRACE
    pid: host
    privileged: true
    volumes:
      - "/:/host:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NRIA_DISPLAY_NAME: mechanic-shop-local
    restart: unless-stopped
    networks:
      - newrelic-mechanic-shop

volumes:
  postgres_data:
