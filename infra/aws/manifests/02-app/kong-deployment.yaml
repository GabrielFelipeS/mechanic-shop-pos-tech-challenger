# Kong em modo DB-less. Diferente das stacks kind/aws-academy, aqui os manifests
# sao aplicados direto por kubectl, sem o checksum do ConfigMap que o Terraform
# calcula la. Como o Kong le o kong.yml apenas no boot, depois de editar
# manifests/01-config/kong-config.yaml e preciso forcar o rollout:
#   kubectl -n mechanic-shop rollout restart deployment/kong
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: mechanic-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.7
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            # Sem `0.0.0.0` a Admin API escuta so em loopback e o probe/port-forward nao alcanca.
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
            - name: status
              containerPort: 8100
          volumeMounts:
            - name: declarative-config
              mountPath: /kong/declarative
              readOnly: true
          # A porta de status existe justamente para health check e nao serve
          # trafego, entao os probes nao competem com o proxy.
          startupProbe:
            httpGet:
              path: /status
              port: 8100
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: declarative-config
          configMap:
            name: kong-declarative-config
