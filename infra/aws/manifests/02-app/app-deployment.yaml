apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-shop-backend
  labels:
    app: mechanic-shop-backend
  namespace: mechanic-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mechanic-shop-backend
  template:
    metadata:
      name: mechanic-shop-backend
      labels:
        app: mechanic-shop-backend
    spec:
      containers:
        - name: mechanic-shop-backend
          # Tag de commit, nao `latest`: a tag mutavel esconde qual codigo esta rodando.
          # Sendo imutavel, IfNotPresent e seguro e evita um round-trip ao registry.
          image: kaizenn/mechanic-shop-backend:obs-b9c00c1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mechanic-shop-app-configmap
            - secretRef:
                name: mechanic-shop-app-secret
          ports:
            - containerPort: 8080
          env:
            # Kubernetes metadata consumed by the New Relic agent so that APM transactions,
            # logs and traces are linked to the pod/deployment/cluster in the New Relic UI.
            - name: NEW_RELIC_METADATA_KUBERNETES_CLUSTER_NAME
              value: eks-mechanic-shop
            - name: NEW_RELIC_METADATA_KUBERNETES_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NEW_RELIC_METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEW_RELIC_METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEW_RELIC_METADATA_KUBERNETES_DEPLOYMENT_NAME
              value: mechanic-shop-backend
            - name: NEW_RELIC_METADATA_KUBERNETES_CONTAINER_NAME
              value: mechanic-shop-backend
          # Actuator-backed probes: they check the application (and its datasource, through the
          # readiness group) instead of merely checking that the TCP port is open.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          # The New Relic Java agent adds roughly 100Mi of heap/metaspace on top of the
          # application itself; the previous 256Mi limit would OOMKill the pod on startup.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
