apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-shop-backend
  namespace: ${namespace}
spec:
  replicas: ${app_replicas}
  selector:
    matchLabels:
      app: mechanic-shop-backend
  template:
    metadata:
      labels:
        app: mechanic-shop-backend
    spec:
      containers:
        - name: mechanic-shop-backend
          image: ${app_image}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mechanic-shop-app-config
            - secretRef:
                name: mechanic-shop-app-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: ${app_cpu_request}
              memory: ${app_memory_request}
            limits:
              cpu: ${app_cpu_limit}
              memory: ${app_memory_limit}
