# Porta de entrada do cluster. A partir daqui o Service da API e ClusterIP:
# todo trafego externo passa obrigatoriamente pelo gateway, como no compose.
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: ${namespace}
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: ${kong_node_port}
