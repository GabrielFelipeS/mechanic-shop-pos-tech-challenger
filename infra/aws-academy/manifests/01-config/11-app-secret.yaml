apiVersion: v1
kind: Secret
metadata:
  name: mechanic-shop-app-secret
  namespace: ${namespace}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "${postgres_password}"
  SEED_DEFAULT_PASSWORD: "${seed_default_password}"
  # Mesmo valor gravado no consumer jwt do kong-declarative-config: o gateway
  # so consegue validar a assinatura dos tokens emitidos pela aplicacao se os
  # dois lados compartilharem este segredo.
  JWT_SECRET: "${jwt_secret}"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  NEW_RELIC_LICENSE_KEY: "${newrelic_license_key}"
