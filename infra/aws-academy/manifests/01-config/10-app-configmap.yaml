apiVersion: v1
kind: ConfigMap
metadata:
  name: mechanic-shop-app-config
  namespace: ${namespace}
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${postgres_database}"
  SPRING_DATASOURCE_USERNAME: "${postgres_username}"
  SMTP_ACTIVE: "false"
  SMTP_HOST: "mailpit"
  SMTP_PORT: "1025"
  APP_BASE_URL: "${app_base_url}"

  # ---------- Observability ----------
  # Activates application-prod.yaml, which turns on the structured (JSON) log format.
  SPRING_PROFILES_ACTIVE: "prod"
  APP_ENVIRONMENT: "${environment}"
  NEW_RELIC_APP_NAME: "${newrelic_app_name}"
  NEW_RELIC_LABELS: "env:${environment};service:mechanic-shop"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED: "true"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
  SEED_WH_NAME: "Warehouse Clerk"
  SEED_WH_EMAIL: "warehouse@shop.com"
  SEED_WH_DOC: "99729415006"
  SEED_WH_ROLE: "WAREHOUSE_CLERK"
  SEED_RC_NAME: "Receptionist"
  SEED_RC_EMAIL: "receptionist@shop.com"
  SEED_RC_DOC: "77658925026"
  SEED_RC_ROLE: "RECEPTIONIST"
  SEED_MC_NAME: "Mechanic"
  SEED_MC_EMAIL: "mechanic@shop.com"
  SEED_MC_DOC: "89146700056"
  SEED_MC_ROLE: "MECHANIC"
  SEED_AD_NAME: "Admin"
  SEED_AD_EMAIL: "admin@shop.com"
  SEED_AD_DOC: "54219023039"
  SEED_AD_ROLE: "ADMIN"
  SEED_BY_NAME: "Buyer"
  SEED_BY_EMAIL: "buyer@shop.com"
  SEED_BY_DOC: "53596055064"
  SEED_BY_ROLE: "BUYER"
