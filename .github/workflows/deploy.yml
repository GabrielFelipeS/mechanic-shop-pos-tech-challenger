name: Deploy Kind

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Tests
        run: mvn clean verify

      - name: Package
        run: mvn package -DskipTests

  docker:
    needs: build-test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Tag
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        run: docker login -u kaizenn -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t kaizenn/mechanic-shop-backend:${{ steps.vars.outputs.sha }} \
            -t kaizenn/mechanic-shop-backend:latest \
            .

      - name: Push Docker Image
        run: |
          docker push kaizenn/mechanic-shop-backend:${{ steps.vars.outputs.sha }}
          docker push kaizenn/mechanic-shop-backend:latest

  deploy-k8s:
    needs:
      - docker

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Terraform
        env:
          # Injeta a license key do New Relic no Secret da aplicacao e habilita o
          # nri-bundle no cluster. Sem o secret configurado o deploy segue sem
          # observabilidade em vez de falhar.
          TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          # Precisa casar com infra/newrelic/terraform/envs/kind.tfvars, que e o
          # arquivo de identidade consumido pela stack de observabilidade.
          TF_VAR_environment: local
          TF_VAR_newrelic_app_name: mechanic-shop (Local)
        run: |
          cd ./infra/kind
          terraform init
          terraform apply -auto-approve

  # Dashboards, politicas de alerta e monitor de uptime da conta New Relic.
  # Roda depois do cluster para que as entidades ja existam quando o dashboard
  # for aberto. Nao falha o pipeline quando os segredos nao estao configurados.
  deploy-observability:
    needs:
      - deploy-k8s

    runs-on: ubuntu-latest

    # Definido no nivel do job para que o `if` do step possa consultar o valor
    # (o contexto `secrets` nao esta disponivel em `if` de step).
    env:
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      TF_VAR_health_check_url: ${{ vars.HEALTH_CHECK_URL }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Apply New Relic dashboards and alerts
        if: env.TF_VAR_newrelic_api_key != '' && env.TF_VAR_newrelic_account_id != ''
        run: |
          cd ./infra/newrelic/terraform
          terraform init
          # A identidade do ambiente (app_name, cluster_name, workload_name) vem
          # do arquivo do ambiente, nao de valores repetidos aqui. O job acima
          # aplica infra/kind, entao o alvo e envs/kind.tfvars.
          terraform apply -auto-approve -var-file=envs/kind.tfvars
