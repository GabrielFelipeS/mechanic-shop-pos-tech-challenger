name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
#      - master

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Tests
        run: mvn clean verify

      - name: Package
        run: mvn package -DskipTests

  docker:
    needs: build-test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Tag
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        run: docker login -u kaizenn -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t kaizenn/mechanic-shop-backend:${{ steps.vars.outputs.sha }} \
            -t kaizenn/mechanic-shop-backend:latest \
            .

      - name: Push Docker Image
        run: |
          docker push kaizenn/mechanic-shop-backend:${{ steps.vars.outputs.sha }}
          docker push kaizenn/mechanic-shop-backend:latest

  deploy-k8s:
    needs:
      - docker

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Apply Manifests
        run: |
          cd infra/manifests
          kubectl apply -f app-deployment.yaml
          kubectl apply -f app-service.yaml
          kubectl apply -f app-hpa.yaml

      - name: Wait Rollout
        run: |
          kubectl rollout status \
            deployment/app \
            -n production \
            --timeout=300s
