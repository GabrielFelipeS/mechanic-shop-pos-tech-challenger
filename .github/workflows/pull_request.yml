name: Build & Test (PR)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # pode usar o GitHub-hosted mesmo

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # se quiser cachear dependências do Maven (opcional)
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build do projeto
        run: mvn clean package -DskipTests

      - name: Executar testes
        run: mvn test

  # Valida os stacks de infraestrutura, incluindo o de observabilidade.
  terraform-validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra/kind
          - infra/aws
          - infra/newrelic/terraform

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive ${{ matrix.stack }}

      - name: Terraform init
        run: terraform -chdir=${{ matrix.stack }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate
