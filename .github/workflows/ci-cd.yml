name: Application CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode verify

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        run: |
          echo "app_image=${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build -t "${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-backend:${GITHUB_SHA}" .
          docker push "${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-backend:${GITHUB_SHA}"
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - name: Render and apply Kubernetes manifests
        env:
          namespace: mechanic-shop
          app_image: ${{ env.app_image }}
          app_replicas: '1'
          app_cpu_request: 300m
          app_cpu_limit: 1000m
          app_memory_request: 256Mi
          app_memory_limit: 512Mi
          hpa_min_replicas: '1'
          hpa_max_replicas: '10'
          hpa_cpu_average_utilization: '80'
          mailpit_ui_node_port: '30025'
          mailpit_smtp_node_port: '31025'
          cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
          kong_image: kong:3.7
          kong_replicas: '1'
          kong_node_port: '30000'
          kong_cpu_request: 100m
          kong_cpu_limit: 500m
          kong_memory_request: 128Mi
          kong_memory_limit: 512Mi
          app_base_url: ${{ vars.APP_BASE_URL }}
          aws_region: ${{ vars.AWS_REGION }}
          lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME }}
          newrelic_app_name: ${{ vars.NEW_RELIC_APP_NAME }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SEED_DEFAULT_PASSWORD: ${{ secrets.SEED_DEFAULT_PASSWORD }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl apply -f k8s/03-cluster-addons
          find k8s/00-namespaces k8s/01-config k8s/03-app -type f -name '*.yaml' -print0 | \
            xargs -0 -I{} sh -c 'envsubst < "$1" | kubectl apply -f -' sh {}
          kubectl create secret generic mechanic-shop-app-secret --namespace mechanic-shop \
            --from-literal=SPRING_DATASOURCE_URL="$DATABASE_URL" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$DATABASE_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$DATABASE_PASSWORD" \
            --from-literal=SEED_DEFAULT_PASSWORD="$SEED_DEFAULT_PASSWORD" \
            --from-literal=INTERNAL_API_SECRET="$INTERNAL_API_SECRET" \
            --from-literal=JWT_SECRET="$jwt_secret" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout status deployment/mechanic-shop-backend --namespace mechanic-shop --timeout=5m
          kubectl rollout status deployment/kong --namespace mechanic-shop --timeout=5m
