spring:
  application:
    name: pos-tech-challenge-mechanic-shop

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/mechanic-shop-db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    active: ${SMTP_ACTIVE:false}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # Exposes /actuator/health/liveness and /actuator/health/readiness so the Kubernetes
      # probes can check the application instead of just the TCP socket.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    # E-mail e um efeito colateral assincrono e nao critico: a OS e persistida com
    # sucesso mesmo quando o SMTP esta fora, e a falha ja e reportada pelo evento
    # MechanicShopIntegrationFailure (que tem alerta proprio). Manter o indicador
    # ligado deixaria /actuator/health permanentemente em 503 com SMTP_ACTIVE=false,
    # o que quebraria a metrica de uptime do Synthetics.
    mail:
      enabled: false
  info:
    env:
      enabled: true

springdoc:
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

api:
  security:
    token:
      secret: "234235negknsdg#$$@#@#"

