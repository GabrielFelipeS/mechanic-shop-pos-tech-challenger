apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:

        - name: app

          image: kaizeen:mechanic-shop

          ports:
            - containerPort: 8080

          env:

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://SEU_RDS:5432/mechanicshop

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres123