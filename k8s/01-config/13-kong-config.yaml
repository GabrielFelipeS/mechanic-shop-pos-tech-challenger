# Configuracao declarativa do Kong (modo DB-less).
#
# E o mesmo conteudo de kong/kong.yml usado pelo docker-compose, com duas
# diferencas obrigatorias no cluster:
#   - o upstream aponta para o Service `mechanic-shop-backend` em vez do
#     container `springapp`;
#   - o segredo do plugin jwt vem do Terraform (var.jwt_secret), o mesmo valor
#     injetado como JWT_SECRET no Secret da aplicacao. Kong nao expande
#     variaveis de ambiente dentro do arquivo declarativo, entao a unica forma
#     de manter os dois lados em sincronia e templar o arquivo aqui.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: ${namespace}
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: springapp
        url: http://mechanic-shop-backend:8080
        routes:
          # Rotas sensiveis ao cliente (ver matriz de papeis no README):
          # protegidas pelo plugin jwt aqui, somando-se ao @PreAuthorize do
          # Spring em vez de substitui-lo.
          - name: service-orders-budget-response
            methods: ["POST"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/service-orders/[0-9a-fA-F-]{36}/budget-response$"
            plugins:
              - name: jwt
          - name: service-orders-status
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/service-orders/[0-9a-fA-F-]{36}/status$"
            plugins:
              - name: jwt
          - name: service-orders-detail
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/service-orders/[0-9a-fA-F-]{36}$"
            plugins:
              - name: jwt
          - name: service-orders-search
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "/api/service-orders/search"
            plugins:
              - name: jwt
          - name: vehicles-detail
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/vehicles/[0-9a-fA-F-]{36}$"
            plugins:
              - name: jwt
          - name: vehicles-search
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "/api/vehicles/search"
            plugins:
              - name: jwt

          # Exclusiva para a Lambda de login por CPF. O Kong somente encaminha
          # a chamada; a aplicacao valida X-Internal-Secret antes de expor
          # qualquer dado do cliente.
          - name: internal-customer-status
            methods: ["GET"]
            strip_path: false
            paths:
              - "/internal"

          # Todo o resto (login, link publico de aprovacao de orcamento por
          # e-mail, swagger e actuator): sem checagem de JWT
          # no gateway, o SecurityFilter/@PreAuthorize do Spring ja governa.
          - name: springapp-general
            strip_path: false
            paths:
              - "/api"
              - "/actuator/health"
              - "/v2/api-docs"
              - "/v3/api-docs"
              - "/swagger-resources"
              - "/swagger-ui"
              - "/webjars"

      - name: cpf-login-function
        # Kong invokes the Terraform-managed Lambda directly. There is no API
        # Gateway between the public Kong route and the function.
        url: http://localhost
        routes:
          - name: cpf-login-route
            strip_path: true
            paths:
              - "/functions/cpf-login"
        plugins:
          - name: aws-lambda
            config:
              aws_region: ${aws_region}
              function_name: ${lambda_function_name}
              invocation_type: RequestResponse
              awsgateway_compatible: true

    consumers:
      - username: mechanic-shop-users
        jwt_secrets:
          # `key` precisa ser igual a claim `iss` de todo token emitido pela
          # aplicacao (TokenService.java fixa o issuer "mechanic-shop-api"; a
          # cpf-login-function espelha o mesmo valor). Um unico consumer cobre
          # todos os usuarios porque o issuer nao varia por usuario.
          - key: mechanic-shop-api
            algorithm: HS256
            secret: ${jwt_secret}
