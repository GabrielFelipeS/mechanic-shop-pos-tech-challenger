apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-shop-backend
  namespace: ${namespace}
spec:
  replicas: ${app_replicas}
  selector:
    matchLabels:
      app: mechanic-shop-backend
  template:
    metadata:
      labels:
        app: mechanic-shop-backend
    spec:
      containers:
        - name: mechanic-shop-backend
          image: ${app_image}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mechanic-shop-app-config
            - secretRef:
                name: mechanic-shop-app-secret
          env:
            # Kubernetes metadata consumed by the New Relic agent so that APM transactions,
            # logs and traces are linked to the pod/deployment/cluster in the New Relic UI.
            - name: NEW_RELIC_METADATA_KUBERNETES_CLUSTER_NAME
              value: ${cluster_name}
            - name: NEW_RELIC_METADATA_KUBERNETES_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NEW_RELIC_METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEW_RELIC_METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEW_RELIC_METADATA_KUBERNETES_DEPLOYMENT_NAME
              value: mechanic-shop-backend
            - name: NEW_RELIC_METADATA_KUBERNETES_CONTAINER_NAME
              value: mechanic-shop-backend
          # Actuator-backed probes: they check the application (and its datasource, through the
          # readiness group) instead of merely checking that the TCP port is open.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: ${app_cpu_request}
              memory: ${app_memory_request}
            limits:
              cpu: ${app_cpu_limit}
              memory: ${app_memory_limit}
