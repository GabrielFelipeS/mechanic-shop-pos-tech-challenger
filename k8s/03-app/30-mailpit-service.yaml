apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ${namespace}
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: 8025
      nodePort: ${mailpit_ui_node_port}
    - name: smtp
      port: 1025
      targetPort: 1025
      nodePort: ${mailpit_smtp_node_port}
