# Admin API do Kong. Fica ClusterIP de proposito: em DB-less ela e somente
# leitura, mas ainda expoe a configuracao inteira (inclusive o segredo do JWT).
# Para inspecionar: kubectl -n ${namespace} port-forward svc/kong-admin 8001:8001
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: ${namespace}
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
