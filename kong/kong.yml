_format_version: "3.0"

# NOTE: the `secret` below must match JWT_SECRET in docker-compose.yaml /
# api.security.token.secret in application.yaml. Kong's declarative config
# does not support env var substitution, so all three must be kept in sync
# manually for local/demo use.

services:
  - name: springapp
    url: http://springapp:8080
    routes:
      # Customer-sensitive routes (see README's role matrix): gated by the
      # jwt plugin here, on top of (not instead of) Spring's own @PreAuthorize.
      - name: service-orders-budget-response
        methods: ["POST"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/service-orders/[0-9a-fA-F-]{36}/budget-response$"
        plugins:
          - name: jwt
      - name: service-orders-status
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/service-orders/[0-9a-fA-F-]{36}/status$"
        plugins:
          - name: jwt
      - name: service-orders-detail
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/service-orders/[0-9a-fA-F-]{36}$"
        plugins:
          - name: jwt
      - name: service-orders-search
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "/api/service-orders/search"
        plugins:
          - name: jwt
      - name: vehicles-detail
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/vehicles/[0-9a-fA-F-]{36}$"
        plugins:
          - name: jwt
      - name: vehicles-search
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "/api/vehicles/search"
        plugins:
          - name: jwt

      # Everything else (login, the public budget-approval email link, swagger,
      # actuator, staff-only endpoints): no gateway-level JWT check, Spring's
      # own SecurityFilter/@PreAuthorize already fully governs these.
      - name: springapp-general
        strip_path: false
        paths:
          - "/api"
          - "/actuator/health"
          - "/v2/api-docs"
          - "/v3/api-docs"
          - "/swagger-resources"
          - "/swagger-ui"
          - "/webjars"

  - name: cpf-login-function
    # TODO: replace with the deployed AWS API Gateway invoke URL for the
    # cpf-login-lambda function (github.com/GabrielFelipeS/mechanic-shop-pos-tech-challenger-lambda)
    # once it's deployed. strip_path is false here because the invoke URL's
    # own stage/path prefix must be preserved as-is.
    url: https://REPLACE-ME.execute-api.REGION.amazonaws.com/STAGE/cpf-login
    routes:
      - name: cpf-login-route
        strip_path: true
        paths:
          - "/functions/cpf-login"

consumers:
  - username: mechanic-shop-users
    jwt_secrets:
      # `key` must equal the `iss` claim every token in this app carries
      # (TokenService.java hardcodes issuer "mechanic-shop-api"; the
      # cpf-login-function mirrors it). One consumer/credential covers all
      # users since the issuer never varies per-user.
      - key: mechanic-shop-api
        algorithm: HS256
        secret: local-dev-jwt-secret-change-me
